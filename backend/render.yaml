services:
  - type: web
    name: vaccine-slot-booking-backend
    env: node
    plan: free
    buildCommand: 'npm install'
    startCommand: 'mkdir -p /app/backend/data && node index.js'
    healthCheckPath: /api/health
    disks:
      - name: data
        mountPath: /app/backend/data
        sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: "/app/backend/data/db.sqlite"
